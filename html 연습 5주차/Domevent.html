<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DOM 실습</title>
</head>
<body>
    <h1 id="title">원래 제목</h1>
    <button id="changeBtn">제목 변경</button>

    <script>
        const title = document.querySelector('#title');
        const button = document.querySelector('#changeBtn');

        button.addEventListener('click', () => {
            title.textContent = '새로운 제목!';
        });
    </script>
</body>
</html>
