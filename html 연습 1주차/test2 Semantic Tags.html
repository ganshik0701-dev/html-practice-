<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현이의 html 연습!!!!</title>
<!-- 화면폭에 맞춰서 보여줘? -->
</head>
<body>
    <header>
    <h1>웹사이트 제목</h1>
    <nav>
        <a href="https://www.naver.com/">네이버</a>
        <a href="#about">소개</a>
    </nav>
</header>

<main>
    <article>
        <h2>글 제목</h2>
        <p>글 내용...</p>
    </article>
</main>





<footer>
    <p>저작권 정보</p>
</footer>






</body>
</html>


<!-- 시맨틱 태그
<header> (헤더)
역할: 웹사이트의 최상단 영역입니다.

내용: 주로 사이트의 로고(이름), 검색창, 로그인 버튼 등이 들어갑니다.

비유: 신문의 맨 위 '신문사 이름'과 '발행일'이 적힌 부분과 같습니다.

② <nav> (내비게이션)
역할: 다른 페이지로 이동하는 메뉴판 영역입니다.

내용: '홈', '소개', '게시판', '블로그' 같은 링크들이 모여 있습니다.

비유: 건물의 '층별 안내도'나 책의 '목차' 같은 역할입니다.

③ <main> (메인)
역할: 해당 페이지의 가장 핵심적인 본문이 들어가는 곳입니다.

특징: 한 페이지에 딱 한 번만 사용해야 합니다. (주인공은 한 명이니까요!)

④ <article> (아티클)
역할: 그 자체로 독립적인 내용이 되는 콘텐츠 뭉치입니다.

내용: 블로그 포스트 한 개, 뉴스 기사 한 개, 게시판의 댓글 하나 등이 해당됩니다.

비유: 잡지에서 '특정 기사 한 편'만 따로 오려내도 내용이 이해되죠? 그게 바로 article입니다.

⑤ <footer> (푸터)
역할: 웹사이트의 맨 아래 영역입니다.

내용: 저작권 정보(Copyright), 연락처, 이용약관, 사업자 정보 등이 들어갑니다.

비유: 편지 맨 밑에 쓰는 '추신'이나 책 맨 뒤의 '판권지' 같은 곳입니다. 
-->
