<form action="/submit" method="POST">
   <!-- 일반 텍스트 -->
<input type="text" name="username" placeholder="이름을 입력하세요">

<!-- 이메일 -->
<input type="email" name="email" placeholder="email@example.com">

<!-- 비밀번호 -->
<input type="password" name="password" placeholder="비밀번호">

<!-- 숫자 -->
<input type="number" name="age" min="1" max="100">

<!-- 전화번호 -->
<input type="tel" name="phone" placeholder="010-1234-5678">

<!-- ------------------------------ -->

<!-- 라디오 버튼 (하나만 선택) -->
<input type="radio" name="gender" value="male" id="male">
<label for="male">남성</label>

<input type="radio" name="gender" value="female" id="female">
<label for="female">여성</label>
<label for="female">독서</label>


<!-- 체크박스 (여러 개 선택 가능) name은 value이다!-->
<input type="checkbox" name="hobby" value="reading" id="reading">
<label for="reading">독서</label>
<!-- { "hobby": "reading" }이런 형식으로 서버에 저장! -->

<input type="checkbox" name="hobby" value="sports" id="sports">
<label for="sports">운동동</label>

<!-- --------------------------------------- -->

<!-- 날짜 -->
<input type="date" name="birthday">

<!-- 시간 -->
<input type="time" name="appointment">

<!-- 날짜 + 시간 -->
<input type="datetime-local" name="meeting">

<!-- --------------------------------------- -->


<textarea name="message" rows="5" cols="30" placeholder="메시지를 입력하세요"></textarea>



<select name="city">
    <option value="">도시를 선택하세요</option>
    <option value="seoul">서울</option>
    <option value="busan">부산</option>
    <option value="daegu">대구</option>
</select>


<button type="submit">제출</button>
<button type="reset">초기화</button>
<button type="button">일반 버튼</button>



<!-- 필수 입력 -->
<input type="text" name="username" required>

<!-- 최소/최대 길이 -->
<input type="text" name="username" minlength="3" maxlength="20">

<!-- 패턴 검사 (정규표현식) -->
<input type="text" name="phone" pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}">

<!-- 최소/최대 값 -->
<input type="number" name="age" min="18" max="100">




<table>
    <thead> <!--헤더-->
        <tr> <!--테이블 행-->
            <th>이름</th>
            <th>나이</th>
            <th>직업</th>
        </tr>
    </thead>
    <tbody> <!--본문-->
        <tr>
            <td>홍길동</td>
            <td>25</td>
            <td>개발자</td>
        </tr>
        <tr>
            <td>김철수</td>
            <td>30</td>
            <td>디자이너</td>
        </tr>
    </tbody>
</table>



<!-- 가로 병합 (colspan) -->
<table>
    <tr>
        <td colspan="2">두 칸을 차지하는 셀</td>
    </tr>
    <tr>
        <td>1열</td>
        <td>2열</td>
    </tr>
</table>

<!-- 세로 병합 (rowspan) -->
<table>
    <tr>
        <td rowspan="2">두 행을 차지하는 셀</td>
        <td>1행 2열</td>
    </tr>
    <tr>
        <td>2행 2열</td>
    </tr>
</table>














</form>
