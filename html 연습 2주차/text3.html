<form action="/login" method="POST">
    <h2>로그인</h2>

    <label for="email">이메일:</label>
    <input type="email" id="email" name="email" required>

    <label for="password">비밀번호:</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">로그인</button>


    <form>
    <h2>만족도 설문조사</h2>

    <p>서비스 만족도를 선택해주세요:</p>
    <input type="radio" name="satisfaction" value="5" id="very-satisfied">
    <label for="very-satisfied">매우 만족</label><br>

    <input type="radio" name="satisfaction" value="4" id="satisfied">
    <label for="satisfied">만족</label><br>

    <input type="radio" name="satisfaction" value="3" id="neutral">
    <label for="neutral">보통</label><br>

    <p>개선이 필요한 부분: (중복 선택 가능)</p>
    <input type="checkbox" name="improvement" value="ui" id="ui">
    <label for="ui">UI/UX</label><br>

    <input type="checkbox" name="improvement" value="speed" id="speed">
    <label for="speed">속도</label><br>

    <button type="submit">제출</button>

        </tr>

</table>
